[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "pkt-widget"
version = "1.0.0"
description = "Lightweight PKT timezone converter desktop widget"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "tzdata; sys_platform == 'win32'",
]

[project.scripts]
pkt-widget = "pkt_widget:main"

[tool.pyinstaller]
# see build scripts for PyInstaller arguments
